<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0d12;
    --bg-2: #11141b;
    --fg: #e6e8ed;
    --fg-dim: #8a92a6;
    --accent: __ACCENT__;
    --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
    --border: #1f2430;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; line-height: 1.55; }
  main { max-width: 880px; margin: 0 auto; padding: 64px 24px 96px; }
  .pitch {
    font-size: clamp(1.4rem, 2.6vw, 2rem);
    font-weight: 600;
    color: var(--fg);
    margin: 0 0 8px;
    line-height: 1.3;
  }
  .pitch-sub {
    font-size: 1.05rem;
    color: var(--fg-dim);
    margin: 0 0 56px;
  }
  h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin: 56px 0 16px;
    font-weight: 600;
  }
  .card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
  }
  .analogy-table {
    width: 100%;
    border-collapse: collapse;
    margin: 0;
  }
  .analogy-table th, .analogy-table td {
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .analogy-table th {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--fg-dim);
    font-weight: 500;
  }
  .analogy-table td:first-child { color: var(--accent); }
  .analogy-table tr:last-child td { border-bottom: none; }
  code, pre {
    font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 0.92em;
  }
  code { background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; color: var(--fg); }
  pre {
    background: #06080d;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    overflow-x: auto;
    margin: 0;
  }
  pre code { background: transparent; padding: 0; }
  .file-ref {
    display: inline-block;
    color: var(--accent);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.88em;
  }
  ul.refs { list-style: none; padding: 0; margin: 0; }
  ul.refs li { padding: 10px 0; border-bottom: 1px solid var(--border); }
  ul.refs li:last-child { border-bottom: none; }
  .cta {
    margin-top: 56px;
    padding: 24px 28px;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .cta h2 { color: var(--fg); margin-top: 0; }
  .mermaid {
    background: #06080d;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin: 16px 0;
    text-align: center;
  }
  @media (prefers-color-scheme: light) {
    /* opt-in only — keep dark default */
  }
</style>
</head>
<body>
<main>
  <p class="pitch">__PITCH_HEADLINE__</p>
  <p class="pitch-sub">__PITCH_SUBTITLE__</p>

  <h2>Mental model</h2>
  <div class="card">
    <p>__ANALOGY_INTRO__</p>
    <table class="analogy-table">
      <thead><tr><th>__ANALOGY_DOMAIN__</th><th>The real thing</th></tr></thead>
      <tbody>
        __ANALOGY_ROWS__
      </tbody>
    </table>
  </div>

  <h2>The technical bit</h2>
  <div class="card">
    __TECHNICAL_BODY__
  </div>

  __OPTIONAL_DIAGRAM__

  <div class="cta">
    <h2>What to do with this</h2>
    <p>__CTA__</p>
  </div>
</main>

<!-- Mermaid lazy-load (only if a diagram is present) -->
__MERMAID_SCRIPT__

</body>
</html>
